<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Safe phone number maker test flow</title>
  <desc id="desc">Synthetic fixtures go to local and CI tests with outbound SMS blocked. Delivery checks use a separate provider sandbox and allowlisted test recipient.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="750">Keep generated test numbers off the live SMS path</text>
  <text x="60" y="110" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="18">A phone number maker creates input data. Your transport decides whether a message can leave the test.</text>

  <rect x="55" y="190" width="260" height="145" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="55" y="190" width="12" height="145" rx="6" fill="#2563eb"/>
  <text x="90" y="232" fill="#1d4ed8" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">INPUT DATA</text>
  <text x="90" y="273" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Synthetic fixture</text>
  <text x="90" y="306" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Format and parser tests</text>

  <path d="M315 262 H385" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="400" y="175" width="310" height="175" rx="20" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="400" y="175" width="12" height="175" rx="6" fill="#dc2626"/>
  <text x="435" y="217" fill="#b91c1c" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">LOCAL + CI</text>
  <text x="435" y="258" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Blocked transport</text>
  <text x="435" y="291" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">No provider client or credentials</text>
  <rect x="435" y="308" width="118" height="28" rx="14" fill="#fee2e2"/>
  <text x="494" y="328" text-anchor="middle" fill="#991b1b" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">SEND DENIED</text>

  <path d="M710 262 H780" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="745" cy="262" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <path d="M736 253 L754 271 M754 253 L736 271" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <rect x="805" y="190" width="335" height="145" rx="20" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="840" y="232" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">LIVE RECIPIENTS</text>
  <text x="840" y="273" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Never use fixtures</text>
  <text x="840" y="306" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">A plausible string may be assigned</text>

  <rect x="55" y="405" width="260" height="145" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="55" y="405" width="12" height="145" rx="6" fill="#0f766e"/>
  <text x="90" y="447" fill="#0f766e" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">DELIVERY TEST</text>
  <text x="90" y="488" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Controlled recipient</text>
  <text x="90" y="521" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">A line your team is allowed to use</text>

  <path d="M315 477 H385" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="400" y="405" width="310" height="145" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="400" y="405" width="12" height="145" rx="6" fill="#2563eb"/>
  <text x="435" y="447" fill="#1d4ed8" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">EXPLICIT MODE</text>
  <text x="435" y="488" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Sandbox + allowlist</text>
  <text x="435" y="521" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Separate account, no live fallback</text>

  <path d="M710 477 H780" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="805" y="405" width="335" height="145" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="840" y="447" fill="#1d4ed8" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1">PROVIDER TEST</text>
  <text x="840" y="488" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Only the tested path</text>
  <text x="840" y="521" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Proves API behavior, not carrier delivery</text>

  <text x="60" y="607" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="16">Format is not assignment. Keep the generator separate from the message transport.</text>
</svg>