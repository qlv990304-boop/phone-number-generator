<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">The same fictional example can pass different form rules</title><desc id="d">A US national display passes a matching display pattern but fails an international shape. Its plus-prefixed representation reverses the result. Neither result is SMS delivery.</desc><rect width="1200" height="560" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="60" y="70" font-size="34" font-weight="700">Does it work? Name the form rule.</text><text x="60" y="112" font-size="21" fill="#475569">One fictional US example, two representations, two acceptance rules</text><rect x="60" y="165" width="320" height="205" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="84" y="207" font-size="24" font-weight="700">Fixed test values</text><text x="84" y="263" font-size="26">202-555-0123</text><text x="84" y="320" font-size="26">+12025550123</text><text x="445" y="192" font-size="23" font-weight="700">US display rule</text><text x="780" y="192" font-size="23" font-weight="700">International shape</text><rect x="430" y="220" width="290" height="65" rx="12" fill="#dcfce7"/><text x="458" y="262" font-size="27" fill="#166534">PASS</text><rect x="765" y="220" width="370" height="65" rx="12" fill="#fee2e2"/><text x="795" y="262" font-size="27" fill="#991b1b">FAIL</text><rect x="430" y="295" width="290" height="65" rx="12" fill="#fee2e2"/><text x="458" y="337" font-size="27" fill="#991b1b">FAIL</text><rect x="765" y="295" width="370" height="65" rx="12" fill="#dcfce7"/><text x="795" y="337" font-size="27" fill="#166534">PASS</text><rect x="60" y="410" width="1075" height="95" rx="16" fill="#fff7ed" stroke="#fb923c"/><text x="85" y="449" font-size="24" font-weight="700">A passing field does not establish a working line.</text><text x="85" y="482" font-size="20" fill="#475569">Documented fictional examples • Offline form checks • No calls, SMS or verification codes</text></g></svg>
