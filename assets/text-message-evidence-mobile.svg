<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" role="img" aria-labelledby="t d"><title id="t">One test message, three separate claims</title><desc id="d">Phone layout: sent means carrier acceptance, delivery reported means a matching receipt, and human reading needs a separate observation. A late sent event must not erase a delivery report.</desc><rect width="400" height="840" rx="20" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="24" y="44" font-size="26" font-weight="700">Track one test message</text><text x="24" y="76" font-size="16" fill="#475569">Original offline replay</text><g fill="white" stroke="#94a3b8" stroke-width="2"><rect x="24" y="108" width="352" height="124" rx="14"/><rect x="24" y="272" width="352" height="124" rx="14"/><rect x="24" y="436" width="352" height="124" rx="14"/></g><g font-size="24" font-weight="700"><text x="44" y="146">Sent</text><text x="44" y="310">Delivery reported</text><text x="44" y="474">Person read it?</text></g><g font-size="18" fill="#334155"><text x="44" y="182">Carrier accepted it.</text><text x="44" y="210">Delivery unconfirmed.</text><text x="44" y="346">Matching receipt.</text><text x="44" y="374">Keep this evidence.</text><text x="44" y="510">A separate observation.</text><text x="44" y="538">Not proved by this replay.</text></g><path d="M200 242v20m-8-8 8 8 8-8" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="24" y="600" width="352" height="216" rx="14" fill="#172554"/><text x="44" y="642" font-size="22" font-weight="700" fill="white">Late event example</text><g fill="#dbeafe"><text x="44" y="677" font-size="18">delivered → sent</text><text x="44" y="716" font-size="18">Keep: delivery reported</text><text x="44" y="752" font-size="16">First match the message ID.</text><text x="44" y="782" font-size="16">Preserve conflicts for review.</text></g></g></svg>