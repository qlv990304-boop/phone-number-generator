<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Keep exports matched to current options</title><desc id="desc">Change options, invalidate batch, capture revision and request, accept only current completion, then export the committed snapshot. A late old A request stays obsolete after A B A.</desc><rect width="1200" height="600" rx="24" fill="#0b1324"/><g font-family="Arial,sans-serif" fill="#edf3ff"><text x="54" y="73" font-size="34" font-weight="700">One current batch. One export snapshot.</text><rect x="54" y="117" width="300" height="235" rx="18" fill="#17233b"/><text x="78" y="162" font-size="26" font-weight="700">Options change</text><text x="78" y="205" font-size="22">Country / quantity / format</text><text x="78" y="246" font-size="22">Invalidate previous batch</text><text x="78" y="290" font-size="22">Require regeneration</text><path d="M367 235h53m-13-10 13 10-13 10" fill="none" stroke="#62d9c5" stroke-width="5"/><rect x="441" y="117" width="318" height="235" rx="18" fill="#173d41"/><text x="465" y="162" font-size="26" font-weight="700">Async tutorial guard</text><text x="465" y="205" font-size="22">Capture revision + request</text><text x="465" y="246" font-size="22">Reject obsolete completion</text><text x="465" y="290" font-size="22">Commit current rows only</text><path d="M773 235h53m-13-10 13 10-13 10" fill="none" stroke="#62d9c5" stroke-width="5"/><rect x="847" y="117" width="299" height="235" rx="18" fill="#17233b"/><text x="871" y="162" font-size="26" font-weight="700">Copy / download</text><text x="871" y="205" font-size="22">Check current snapshot</text><text x="871" y="246" font-size="22">Serialize its own rows</text><text x="871" y="290" font-size="22">Later edits cannot alter it</text><rect x="54" y="389" width="1092" height="133" rx="18" fill="#352837"/><text x="78" y="433" font-size="25" font-weight="700">A → B → A: same fields do not mean the same request.</text><text x="78" y="477" font-size="22">Latest A commits first. Old A finishes last and is rejected.</text><text x="54" y="563" font-size="19" fill="#b4c5df">GetPhoneNum · Original offline state experiment · Live bulk tool is synchronous · No SMS</text></g></svg>