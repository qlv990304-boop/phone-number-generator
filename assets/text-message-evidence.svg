<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Sent, delivery reported, and human reading are different observations</title><desc id="d">In a synthetic replay, delivered followed by sent remains delivery reported. A different message identifier cannot upgrade the target. No human reading is proven.</desc><rect width="1200" height="560" rx="24" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="48" y="68" font-size="34" font-weight="700">One test message. Three different claims.</text><text x="48" y="110" font-size="22" fill="#475569">Original offline replay · no messages sent</text><g fill="white" stroke="#94a3b8" stroke-width="2"><rect x="48" y="155" width="334" height="170" rx="16"/><rect x="433" y="155" width="334" height="170" rx="16"/><rect x="818" y="155" width="334" height="170" rx="16"/></g><g font-size="27" font-weight="700"><text x="72" y="202">Sent</text><text x="457" y="202">Delivery reported</text><text x="842" y="202">Person read it?</text></g><g font-size="21" fill="#334155"><text x="72" y="246">Carrier accepted it.</text><text x="72" y="278">Delivery unconfirmed.</text><text x="457" y="246">Matching receipt.</text><text x="457" y="278">Keep the evidence.</text><text x="842" y="246">A separate observation.</text><text x="842" y="278">Not proved by this replay.</text></g><path d="M390 238h32m-12-10 12 10-12 10" fill="none" stroke="#2563eb" stroke-width="4"/><rect x="48" y="365" width="1104" height="142" rx="16" fill="#172554"/><text x="72" y="408" font-size="25" font-weight="700" fill="white">Arrival order: delivered → sent</text><text x="72" y="447" font-size="23" fill="#dbeafe">Guarded label: delivery reported · do not overwrite a receipt with progress</text><text x="72" y="480" font-size="21" fill="#dbeafe">First match the message identifier. Preserve conflicts for review.</text></g></svg>