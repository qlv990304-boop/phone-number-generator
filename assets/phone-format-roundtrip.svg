<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Display round trips preserve canonical identity</title><desc id="desc">A fictional GB canonical value becomes national display with a domestic zero, then returns to the same value using GB context. Missing context fails; wrong context can change identity.</desc><rect width="1200" height="600" rx="24" fill="#0b1324"/><g font-family="Arial,sans-serif" fill="#edf3ff"><text x="54" y="73" font-size="34" font-weight="700">Display changes. Identity stays the same.</text><rect x="54" y="117" width="310" height="235" rx="18" fill="#17233b"/><text x="78" y="162" font-size="26" font-weight="700">Canonical fixture</text><text x="78" y="205" font-size="22">+447700900123</text><text x="78" y="246" font-size="22">Region: GB</text><text x="78" y="290" font-size="22">Delivery: disabled</text><path d="M377 235h43m-13-10 13 10-13 10" fill="none" stroke="#62d9c5" stroke-width="5"/><rect x="441" y="117" width="318" height="235" rx="18" fill="#173d41"/><text x="465" y="162" font-size="26" font-weight="700">National display</text><text x="465" y="205" font-size="22">07700 900123</text><text x="465" y="246" font-size="22">Preserve GB context</text><text x="465" y="290" font-size="22">Domestic prefix: 0</text><path d="M773 235h53m-13-10 13 10-13 10" fill="none" stroke="#62d9c5" stroke-width="5"/><rect x="847" y="117" width="299" height="235" rx="18" fill="#17233b"/><text x="871" y="162" font-size="26" font-weight="700">Parse + compare</text><text x="871" y="205" font-size="22">+447700900123</text><text x="871" y="246" font-size="22">Exact canonical equality</text><text x="871" y="290" font-size="22">Validity is a separate flag</text><rect x="54" y="389" width="1092" height="133" rx="18" fill="#352837"/><text x="78" y="433" font-size="25" font-weight="700">No country: parse error. Wrong country: identity can change.</text><text x="78" y="477" font-size="22">17 assertions: 11 identity-preserving cases + 6 detected negative controls.</text><text x="54" y="563" font-size="19" fill="#b4c5df">GetPhoneNum · Original offline US/GB experiment · Pinned parser and metadata · No SMS</text></g></svg>