<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="24" fill="#eff6ff"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="48" y="64" font-size="34" font-weight="700">Check the bytes before importing a fixture</text><text x="48" y="105" font-size="22">The approved reference must be trusted separately.</text><g fill="#fff" stroke="#bfdbfe" stroke-width="2"><rect x="48" y="155" width="315" height="120" rx="18"/><rect x="48" y="320" width="315" height="120" rx="18"/><rect x="434" y="225" width="315" height="190" rx="18"/><rect x="820" y="225" width="332" height="190" rx="18"/></g><g font-size="25" font-weight="700" fill="#1d4ed8"><text x="72" y="196">Downloaded file</text><text x="72" y="361">Reviewed manifest</text><text x="460" y="269">Byte comparison</text><text x="846" y="269">Separate checks</text></g><g font-size="21"><text x="72" y="240">Read the stored bytes.</text><text x="72" y="406">Expected size + SHA-256</text><text x="460" y="320">Same byte count?</text><text x="460" y="365">Same digest?</text><text x="846" y="320">Schema and provenance</text><text x="846" y="365">Offline delivery policy</text></g><g fill="none" stroke="#2563eb" stroke-width="4"><path d="M367 215h28v65h32m-12-9 12 9-12 9"/><path d="M367 380h28v-25h32m-12-9 12 9-12 9"/><path d="M754 320h58m-12-9 12 9-12 9"/></g><text x="755" y="300" font-size="17" fill="#1d4ed8">PASS</text><rect x="434" y="475" width="718" height="105" rx="18" fill="#fff1f2" stroke="#fda4af"/><text x="460" y="516" font-size="24" font-weight="700" fill="#9f1239">Mismatch: stop before import</text><text x="460" y="550" font-size="21">Do not recompute the expected hash from the failing file.</text><path d="M590 421v46" stroke="#e11d48" stroke-width="3"/><text x="48" y="625" font-size="19">GetPhoneNum original experiment · a checksum does not authenticate an untrusted manifest</text></g></svg>