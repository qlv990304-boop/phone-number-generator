<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Read a lookup as evidence, not a guarantee</title><desc id="d">Check request identity, observation time and package outcome before displaying a reported line status. Delivery, control and contact permission remain unproven.</desc><rect width="1200" height="560" rx="24" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="52" y="72" font-size="34" font-weight="700">What does this lookup actually prove?</text><text x="52" y="112" font-size="21" fill="#475569">An original GetPhoneNum evidence checklist · synthetic experiment</text><g fill="#fff" stroke="#94a3b8" stroke-width="2"><rect x="52" y="164" width="330" height="174" rx="16"/><rect x="435" y="164" width="330" height="174" rx="16"/><rect x="818" y="164" width="330" height="174" rx="16"/></g><g font-size="25" font-weight="700"><text x="76" y="208">1. Same subject?</text><text x="459" y="208">2. Usable time?</text><text x="842" y="208">3. Usable package?</text></g><g font-size="21" fill="#334155"><text x="76" y="250">Request and response</text><text x="76" y="281">must identify one line.</text><text x="459" y="250">Keep the timestamp.</text><text x="459" y="281">Flag stale or future data.</text><text x="842" y="250">Requested, recognized,</text><text x="842" y="281">and free of errors.</text></g><path d="M390 250h33m-12-10 12 10-12 10M773 250h33m-12-10 12 10-12 10" fill="none" stroke="#2563eb" stroke-width="4"/><rect x="52" y="378" width="1096" height="126" rx="16" fill="#172554"/><text x="76" y="420" font-size="26" font-weight="700" fill="white">Display a limited, dated report</text><text x="76" y="461" font-size="23" fill="#dbeafe">Not proof of SMS delivery · not proof of your control · not permission to contact</text></g></svg>