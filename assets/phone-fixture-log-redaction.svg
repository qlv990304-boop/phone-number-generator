<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Review the final log output</title><desc id="desc">Approved replay data enters a small public event. Phone values are masked, OTP and unknown fields omitted. Every reviewed handler output is asserted.</desc><rect width="1200" height="620" rx="24" fill="#0b1324"/><g font-family="Arial,sans-serif" fill="#e8eef9"><text x="64" y="74" font-size="34" font-weight="700">Check the emitted log, not only the input</text><rect x="64" y="120" width="300" height="220" rx="18" fill="#17233b"/><text x="90" y="165" font-size="25" font-weight="700">Fixture failure</text><text x="90" y="205" font-size="21">Nested phone + inert OTP</text><text x="90" y="242" font-size="21">Replay metadata</text><text x="90" y="279" font-size="21">Exception / unknown fields</text><path d="M380 230h52" stroke="#67d5c9" stroke-width="5"/><path d="m423 220 12 10-12 10" fill="none" stroke="#67d5c9" stroke-width="5"/><rect x="454" y="120" width="300" height="220" rx="18" fill="#173d41"/><text x="480" y="165" font-size="25" font-weight="700">Reviewed projection</text><text x="480" y="205" font-size="21">Keep: seed / path / version</text><text x="480" y="242" font-size="21">Mask: phone value</text><text x="480" y="279" font-size="21">Omit: OTP / raw errors</text><path d="M770 230h52" stroke="#67d5c9" stroke-width="5"/><path d="m813 220 12 10-12 10" fill="none" stroke="#67d5c9" stroke-width="5"/><rect x="844" y="120" width="292" height="220" rx="18" fill="#17233b"/><text x="870" y="165" font-size="25" font-weight="700">Every reviewed sink</text><text x="870" y="205" font-size="21">One JSON event</text><text x="870" y="242" font-size="21">Assert canaries absent</text><text x="870" y="279" font-size="21">Assert replay preserved</text><rect x="64" y="385" width="1072" height="152" rx="18" fill="#352837"/><text x="90" y="430" font-size="25" font-weight="700">Unknown shape? Static rejection event; never echo raw input.</text><text x="90" y="471" font-size="21">Our offline experiment: 6 cases / 7 sink outputs / 2 negative controls.</text><text x="90" y="507" font-size="21">Scope: this output contract. Other handlers, traces and artifacts require separate review.</text><text x="64" y="579" font-size="19" fill="#b0bfd4">GetPhoneNum · Original tutorial diagram · Fictional values only · No calls or SMS</text></g></svg>