<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Random draws can collide; sampling without replacement stays unique within a batch</title>
<desc id="desc">An abstract pool of synthetic fixture keys illustrates a repeated key when a draw is replaced, contrasted with a no-replacement batch where each key appears once.</desc>
<defs>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#1c2e47" stroke-width="1"/></pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1729"/><stop offset="1" stop-color="#12233a"/></linearGradient>
</defs>
<rect width="1400" height="760" rx="32" fill="url(#bg)"/>
<rect width="1400" height="760" rx="32" fill="url(#grid)" opacity=".7"/>
<circle cx="1280" cy="80" r="220" fill="#12334a" opacity=".35"/>
<circle cx="42" cy="748" r="210" fill="#0b3343" opacity=".35"/>
<text x="72" y="70" fill="#27d7ca" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">GETPHONENUM · TEST DATA</text>
<text x="72" y="132" fill="#f0f5fb" font-family="Arial,sans-serif" font-size="43" font-weight="700">RANDOM ≠ UNIQUE</text>
<text x="72" y="174" fill="#a9bfd2" font-family="Arial,sans-serif" font-size="22">A draw can repeat unless the selection rule prevents it.</text>

<rect x="72" y="224" width="608" height="404" rx="24" fill="#14283f" stroke="#4c667e" stroke-width="2"/>
<rect x="720" y="224" width="608" height="404" rx="24" fill="#14283f" stroke="#4c667e" stroke-width="2"/>
<text x="108" y="270" fill="#ffb08f" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">WITH REPLACEMENT</text>
<text x="756" y="270" fill="#b8ef72" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">WITHOUT REPLACEMENT</text>
<text x="108" y="307" fill="#a9bfd2" font-family="Arial,sans-serif" font-size="18">The picked key goes back into the pool.</text>
<text x="756" y="307" fill="#a9bfd2" font-family="Arial,sans-serif" font-size="18">Picked keys stay out for this batch.</text>

<text x="108" y="365" fill="#dce7f1" font-family="Arial,sans-serif" font-size="17">DRAW 1</text>
