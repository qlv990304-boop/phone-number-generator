<text x="780" y="574" fill="#c8f28e" font-family="Arial,sans-serif" font-size="18" font-weight="700">Unique within a batch while k ≤ N.</text>

<text x="72" y="696" fill="#dce7f1" font-family="Arial,sans-serif" font-size="22" font-weight="700">For cross-job uniqueness, reserve a canonical fixture key atomically.</text>
