<text x="570" y="486" fill="#ffb08f" font-family="Arial,sans-serif" font-size="16" font-weight="700">COLLISION</text>
<rect x="108" y="540" width="532" height="54" rx="14" fill="#302d38"/>
<text x="132" y="574" fill="#ffcfbb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Repeats are allowed by the draw rule.</text>

