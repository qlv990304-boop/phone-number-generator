<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">US synthetic address fields</title><desc id="desc">Invented street and optional unit fields are combined with a source-linked city, state and ZIP preset. The output is synthetic and unverified for delivery.</desc><rect width="1200" height="510" rx="24" fill="#0f172a"/><g font-family="Arial,sans-serif"><text x="55" y="65" fill="#7dd3fc" font-size="20">GETPHONENUM · ADDRESS SAMPLES</text><text x="55" y="120" fill="#fff" font-size="36" font-weight="700">A US sample keeps its location fields together</text><rect x="55" y="165" width="505" height="240" rx="18" fill="#1e3a5f"/><rect x="640" y="165" width="505" height="240" rx="18" fill="#163643"/><text x="85" y="210" fill="#93c5fd" font-size="20">AUTHORED TEST TEXT</text><text x="85" y="258" fill="#fff" font-size="28">4100 Example Laurel St</text><text x="85" y="302" fill="#cbd5e1" font-size="24">APT 28 (optional line 2)</text><text x="85" y="366" fill="#cbd5e1" font-size="19">Street and unit are synthetic.</text><text x="670" y="210" fill="#5eead4" font-size="20">LOCATION PRESET</text><text x="670" y="258" fill="#fff" font-size="28">Seattle</text><text x="670" y="302" fill="#cbd5e1" font-size="24">WA · Washington · 98104</text><text x="670" y="366" fill="#cbd5e1" font-size="19">City, state and ZIP stay paired.</text><path d="M575 283 H621 M609 269 L623 283 L609 297" stroke="#93c5fd" stroke-width="4" fill="none"/><text x="55" y="462" fill="#cbd5e1" font-size="22">For mockups and form tests · No delivery verification</text></g></svg>
